name: verify

# 质量门禁。push 时自动跑，也可手动触发。
# 部署不在这里 —— 见 deploy.yml（手动触发，全程 GitHub Actions）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Install actionlint
        uses: raven-actions/actionlint@v2

      - name: Hard constraint gate
        run: pnpm check

      - name: Workflow lint
        run: node scripts/check-workflows.mjs

      - name: Build gateway
        run: pnpm --filter @sso/gateway build

      # 产物清单不手写：从 build:js / build:css 的 --outfile 与 build.tsx 的路由推导。
      # 曾经这份清单在 verify.yml 和 deploy-quick.yml 各写了一遍，加 password.js 时两处都漏。
      - name: Assert build output complete
        run: node scripts/verify-build-output.mjs