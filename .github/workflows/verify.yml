name: verify

# 质量门禁。push 时自动跑，也可手动触发。
# 部署不在这里 —— 见 deploy.yml（手动触发，全程 GitHub Actions）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test + constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Hard constraint gate
        run: pnpm check

      - name: Build gateway
        run: pnpm --filter @sso/gateway build

      - name: Assert build output complete
        run: |
          cd packages/gateway
          for f in dist/login.html dist/mfa.html dist/404.html dist/_headers dist/assets/app.css dist/assets/app.js dist/assets/security.js; do
            if [ ! -f "$f" ]; then
              echo "::error::missing build artifact: $f"
              exit 1
            fi
          done
          echo "build output complete"
