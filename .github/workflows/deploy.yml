name: deploy

# 全程由 GitHub Actions 部署到 Cloudflare。
# 手动触发：Actions → deploy → Run workflow
#
# 仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN    Edit Cloudflare Workers 模板
#   CLOUDFLARE_ACCOUNT_ID   Dashboard 右侧栏 Account ID
#   GATEWAY_TOKEN           两个 Worker 共用
#   SESSION_PEPPER          密码哈希 pepper
#   TOTP_MASTER_KEY         TOTP 加密主密钥
#   SIGNING_KEYS_JSON       EdDSA 私钥（JSON 数组）
#
# 仓库 Variables（可选，Settings → Variables）：
#   ISSUER                  如 https://sso.example.com
#   RP_ID                   如 sso.example.com

on:
  workflow_dispatch:
    inputs:
      target:
        description: "部署目标"
        required: true
        default: both
        type: choice
        options: [both, core, gateway]
      run_migrations:
        description: "执行 D1 迁移（首次部署或新增迁移时勾选）"
        required: true
        default: false
        type: boolean
      confirm:
        description: '输入 DEPLOY 确认执行'
        required: true
        default: ""
        type: string

concurrency:
  group: deploy-sso
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.4"

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: 确认输入
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::请在 confirm 输入框填入 DEPLOY 以确认执行"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: 敏感文件检查
        run: |
          if git ls-files | grep -E '(^|/)\.dev\.vars$|seed\.sql|backup-.*\.sql$'; then
            echo "::error::发现敏感文件被追踪，请从仓库移除"
            exit 1
          fi
          echo "敏感文件检查通过"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

  verify:
    name: verify
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm -r typecheck

      - name: 单元测试
        run: pnpm -r test

      - name: 硬约束门禁
        run: pnpm check

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 构建 gateway
        run: pnpm --filter @sso/gateway build

      - name: 断言构建产物齐全
        run: |
          cd packages/gateway
          for f in dist/login.html dist/mfa.html dist/404.html dist/_headers dist/assets/app.css dist/assets/app.js dist/assets/security.js; do
            if [ ! -f "$f" ]; then
              echo "::error::构建产物缺失: $f"
              exit 1
            fi
          done
          echo "构建产物齐全"

      - name: 打包验证（不部署）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @sso/core exec wrangler deploy --dry-run --outdir=.dryrun
          pnpm --filter @sso/gateway exec wrangler deploy --dry-run --outdir=.dryrun

  prepare:
    name: resolve-d1
    needs: build
    runs-on: ubuntu-latest
    outputs:
      database_id: ${{ steps.resolve.outputs.database_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 查询或创建 D1 数据库
        id: resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd packages/core

          # d1 list 支持 --json，d1 create 不支持，所以两者用不同解析方式
          echo "查询现有数据库..."
          DB_ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | node -e "
            let s='';
            process.stdin.on('data',d=>s+=d).on('end',()=>{
              try {
                const list = JSON.parse(s || '[]');
                const hit = list.find(d => d.name === 'sso-db');
                process.stdout.write(hit ? (hit.uuid || hit.id || '') : '');
              } catch { process.stdout.write(''); }
            });
          ")

          if [ -z "$DB_ID" ]; then
            echo "未找到 sso-db，创建中..."
            # d1 create 只输出人类可读文本，形如：
            #   ✅ Successfully created DB 'sso-db'
            #   [[d1_databases]]
            #   binding = "DB"
            #   database_name = "sso-db"
            #   database_id = "xxxxxxxx-xxxx-..."
            pnpm exec wrangler d1 create sso-db 2>&1 | tee /tmp/d1-create.log || true

            # 优先从输出里抓 database_id
            DB_ID=$(grep -oE 'database_id\s*=\s*"[^"]+"' /tmp/d1-create.log | head -1 | sed -E 's/.*"([^"]+)"/\1/' || true)

            # 兜底：抓任意 UUID
            if [ -z "$DB_ID" ]; then
              DB_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1-create.log | head -1 || true)
            fi

            # 最后兜底：重新查询一次（create 可能已成功但输出被截断）
            if [ -z "$DB_ID" ]; then
              echo "从输出解析失败，重新查询..."
              DB_ID=$(pnpm exec wrangler d1 list --json 2>/dev/null | node -e "
                let s='';
                process.stdin.on('data',d=>s+=d).on('end',()=>{
                  try {
                    const list = JSON.parse(s || '[]');
                    const hit = list.find(d => d.name === 'sso-db');
                    process.stdout.write(hit ? (hit.uuid || hit.id || '') : '');
                  } catch { process.stdout.write(''); }
                });
              ")
            fi
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::无法解析或创建 D1 数据库 sso-db"
            echo "--- d1 create 输出 ---"
            cat /tmp/d1-create.log 2>/dev/null || true
            echo "--- d1 list 输出 ---"
            pnpm exec wrangler d1 list 2>&1 || true
            exit 1
          fi

          echo "database_id = $DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

  deploy-core:
    name: deploy-core
    needs: prepare
    if: inputs.target == 'both' || inputs.target == 'core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 注入运行时配置
        env:
          DB_ID: ${{ needs.prepare.outputs.database_id }}
          ISSUER: ${{ vars.ISSUER }}
          RP_ID: ${{ vars.RP_ID }}
        run: |
          set -euo pipefail
          cd packages/core
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|$DB_ID|" wrangler.toml
          if [ -n "${ISSUER:-}" ]; then
            sed -i "s|^ISSUER = .*|ISSUER = "$ISSUER"|" wrangler.toml
          fi
          if [ -n "${RP_ID:-}" ]; then
            sed -i "s|^RP_ID = .*|RP_ID = "$RP_ID"|" wrangler.toml
          fi
          echo "--- 生效配置 ---"
          grep -E '^(ISSUER|RP_ID|database_id)' wrangler.toml || true

      - name: D1 迁移
        if: inputs.run_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/core
          pnpm exec wrangler d1 migrations apply sso-db --remote

      - name: 注入 Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          SESSION_PEPPER: ${{ secrets.SESSION_PEPPER }}
          TOTP_MASTER_KEY: ${{ secrets.TOTP_MASTER_KEY }}
          SIGNING_KEYS_JSON: ${{ secrets.SIGNING_KEYS_JSON }}
        run: |
          set -euo pipefail
          cd packages/core
          node -e "
            const out = {
              GATEWAY_TOKEN: process.env.GATEWAY_TOKEN,
              SESSION_PEPPER: process.env.SESSION_PEPPER,
              TOTP_MASTER_KEY: process.env.TOTP_MASTER_KEY,
              SIGNING_KEYS_JSON: process.env.SIGNING_KEYS_JSON,
            };
            const missing = Object.entries(out).filter(([,v]) => !v).map(([k]) => k);
            if (missing.length) { console.error('缺少 secret: ' + missing.join(', ')); process.exit(1); }
            process.stdout.write(JSON.stringify(out));
          " > /tmp/core-secrets.json
          pnpm exec wrangler secret bulk /tmp/core-secrets.json
          rm -f /tmp/core-secrets.json

      - name: 部署 Core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/core
          pnpm exec wrangler deploy

  deploy-gateway:
    name: deploy-gateway
    needs: [prepare, deploy-core]
    if: |
      always() &&
      (inputs.target == 'both' || inputs.target == 'gateway') &&
      (needs.deploy-core.result == 'success' || needs.deploy-core.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm --filter @sso/gateway build

      - name: 注入运行时配置
        env:
          ISSUER: ${{ vars.ISSUER }}
          RP_ID: ${{ vars.RP_ID }}
        run: |
          set -euo pipefail
          cd packages/gateway
          if [ -n "${ISSUER:-}" ]; then
            sed -i "s|^ISSUER = .*|ISSUER = "$ISSUER"|" wrangler.toml
          fi
          if [ -n "${RP_ID:-}" ]; then
            sed -i "s|^RP_ID = .*|RP_ID = "$RP_ID"|" wrangler.toml
          fi
          grep -E '^(ISSUER|RP_ID)' wrangler.toml || true

      - name: 注入 Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          cd packages/gateway
          node -e "
            if (!process.env.GATEWAY_TOKEN) { console.error('缺少 GATEWAY_TOKEN'); process.exit(1); }
            process.stdout.write(JSON.stringify({ GATEWAY_TOKEN: process.env.GATEWAY_TOKEN }));
          " > /tmp/gw-secrets.json
          pnpm exec wrangler secret bulk /tmp/gw-secrets.json
          rm -f /tmp/gw-secrets.json

      - name: 部署 Gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd packages/gateway
          pnpm exec wrangler deploy

  smoke:
    name: smoke-test
    needs: [deploy-core, deploy-gateway]
    if: |
      always() &&
      (needs.deploy-gateway.result == 'success' || needs.deploy-core.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 解析线上地址
        id: url
        env:
          ISSUER: ${{ vars.ISSUER }}
        run: |
          if [ -n "${ISSUER:-}" ]; then
            echo "base=$ISSUER" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 vars.ISSUER，跳过冒烟测试"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: 冒烟测试
        if: steps.url.outputs.base != ''
        env:
          BASE: ${{ steps.url.outputs.base }}
        run: |
          set -uo pipefail
          base="${BASE%/}"
          fail=0

          check() {
            name="$1"; url="$2"; expect="$3"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
            if [ "$code" = "$expect" ]; then
              echo "PASS  $name ($code)"
            else
              echo "FAIL  $name  期望 $expect 实际 $code  ($url)"
              fail=1
            fi
          }

          check "登录页"       "$base/login" 200
          check "样式表"       "$base/assets/app.css" 200
          check "交互脚本"     "$base/assets/app.js" 200
          check "discovery"   "$base/.well-known/openid-configuration" 200
          check "JWKS"        "$base/oauth/jwks.json" 200
          check "未认证进管理台" "$base/admin" 302

          echo "--- JWKS 私钥泄露检查 ---"
          if curl -s --max-time 15 "$base/oauth/jwks.json" | grep -q '"d"'; then
            echo "::error::JWKS 中出现了私钥字段 d"
            fail=1
          else
            echo "PASS  JWKS 无私钥字段"
          fi

          echo "--- 登录页不应下发 Cookie ---"
          if curl -s -I --max-time 15 "$base/login" | grep -qi '^set-cookie:'; then
            echo "::error::静态登录页下发了 Set-Cookie"
            fail=1
          else
            echo "PASS  登录页无 Set-Cookie"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::冒烟测试失败"
            exit 1
          fi
          echo "全部通过"